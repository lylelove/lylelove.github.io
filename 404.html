<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="页面未找到 - 竟何的个人网站">
    <title>404 - 页面未找到 | 竟何</title>
    <link rel="shortcut icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/lylelove/Course/img/logo.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            z-index: 2;
            animation: fadeInUp 1s ease-out;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin: 0;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 50px rgba(255, 255, 255, 0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        .error-message {
            font-size: 1.5rem;
            margin: 1rem 0 2rem;
            opacity: 0.9;
        }
        
        .error-description {
            font-size: 1rem;
            margin-bottom: 2rem;
            opacity: 0.7;
            line-height: 1.6;
        }
        
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 500;
        }
        
        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-color: transparent;
        }
        
        .btn-primary:hover {
            background: linear-gradient(45deg, #ff5252, #26c6da);
            transform: translateY(-2px) scale(1.05);
        }
        
        /* Floating shapes animation */
        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }
        
        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            left: 20%;
            animation-delay: 2s;
        }
        
        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            left: 70%;
            animation-delay: 4s;
        }
        
        .shape:nth-child(4) {
            width: 100px;
            height: 100px;
            left: 80%;
            animation-delay: 6s;
        }
        
        .shape:nth-child(5) {
            width: 40px;
            height: 40px;
            left: 40%;
            animation-delay: 8s;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            }
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
            }
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 5rem;
            }
            
            .error-message {
                font-size: 1.2rem;
            }
            
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
        
        /* Back animation */
        .back-animation {
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }
    </style>
</head>

<body>
    <!-- Floating shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <!-- Main content -->
    <div class="container">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">页面走丢了</h2>
        <p class="error-description">
            抱歉，您访问的页面不存在或已被移动。<br>
            让我们帮您找到正确的方向。
        </p>
        
        <div class="btn-group">
            <a href="/" class="btn btn-primary">
                <span class="back-animation">🏠</span> 返回首页
            </a>
            <a href="https://lylelove.top" class="btn" target="_blank" rel="noopener noreferrer">
                📝 我的便签
            </a>
            <a href="https://note.lylelove.top" class="btn" target="_blank" rel="noopener noreferrer">
                📚 我的Wiki
            </a>
        </div>
    </div>
    
    <script>
        // Auto redirect countdown (optional)
        let countdown = 10;
        const countdownElement = document.createElement('p');
        countdownElement.style.cssText = `
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.7;
            font-size: 0.9rem;
        `;
        document.body.appendChild(countdownElement);
        
        function updateCountdown() {
            if (countdown > 0) {
                countdownElement.textContent = `${countdown} 秒后自动跳转到首页`;
                countdown--;
                setTimeout(updateCountdown, 1000);
            } else {
                window.location.href = '/';
            }
        }
        
        // Start countdown after 3 seconds
        setTimeout(updateCountdown, 3000);
        
        // Add click event to stop countdown
        document.addEventListener('click', function() {
            countdown = 0;
            countdownElement.style.display = 'none';
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                window.location.href = '/';
            }
        });
        
        // Generate more floating shapes dynamically
        function createFloatingShape() {
            const shape = document.createElement('div');
            shape.className = 'shape';
            shape.style.left = Math.random() * 100 + '%';
            shape.style.width = (Math.random() * 60 + 40) + 'px';
            shape.style.height = shape.style.width;
            shape.style.animationDelay = Math.random() * 20 + 's';
            shape.style.animationDuration = (Math.random() * 10 + 15) + 's';
            
            document.querySelector('.floating-shapes').appendChild(shape);
            
            // Remove shape after animation completes
            setTimeout(() => {
                if (shape.parentNode) {
                    shape.parentNode.removeChild(shape);
                }
            }, 25000);
        }
        
        // Create new shapes periodically
        setInterval(createFloatingShape, 3000);
    </script>
</body>
</html>
